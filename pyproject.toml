[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-roof-cooling-lidar"
version = "0.1.0"
description = "Green roof cooling from lidar urban form and neural networks (companion code for Kafy, Crews and Thompson 2024)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdulla Al Kafy", email = "abdullaalkafy@utexas.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
download = ["pystac-client>=0.7", "planetary-computer>=1.0", "odc-stac>=0.3", "odc-geo>=0.4", "rasterio>=1.3", "pyproj>=3.5"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E701", "E702", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
